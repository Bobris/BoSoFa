name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The cluster tests run on a private Azurite blob service.
      - name: Install Azurite
        run: npm install --global azurite@3.35.0
      - run: dotnet build BoSoFa.slnx -c Release
      - name: Generated desktop RPC binding is up to date
        run: git diff --exit-code -- web/apps/desktop/neoastra/neoastra.ts
        shell: bash
      # Includes ContractTest: the checked-in web/packages/api/openapi.json must match the server.
      # A hung test fails after 3 minutes and is named in the log.
      - run: dotnet test BoSoFa.slnx -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none --logger "console;verbosity=normal"
      # White labeling: another brand builds, and the tests that name binaries, folders and services pass with it.
      - name: Brand qsf
        if: runner.os == 'Linux'
        run: >-
          dotnet test BoSoFa.slnx -c Release -p:Brand=qsf -p:ArtifactsPath=${{ github.workspace }}/artifacts/brand-qsf
          --filter "FullyQualifiedName~BrandingTest|FullyQualifiedName~ServicePlanTest|FullyQualifiedName~WorktreeTest|FullyQualifiedName~McpEndpointTest|FullyQualifiedName~DownloadTest|FullyQualifiedName~LocalDaemonTest"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Server image builds
        run: docker build -f deploy/Dockerfile -t bosofa-server:ci .

  bundle:
    # The server's publish builds the daemon and the desktop app for every platform, here on Linux as in the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      # Trimming warnings are errors (TreatWarningsAsErrors), so this is also the daemon's trimming gate.
      - run: dotnet publish src/BoSoFa.Server -c Release -p:Version=0.0.0-ci -o out
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: out/bundle
          if-no-files-found: error

  bundle-runs:
    # What was built on Linux must run on each OS: the daemon as a real service, and the desktop archive must unpack.
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bundle
          path: bundle
      # Artifacts lose the executable bit.
      - name: Daemon
        shell: bash
        run: |
          mkdir out
          cp bundle/daemon/${{ matrix.rid }}/* out/
          chmod +x out/*
          ./out/bosofad* version
      - name: Install as a service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ./out/bosofad install --scope system --service-user "$USER" --data-dir /tmp/bosofa-service
          sleep 5
          systemctl is-active bosofad.service
          sudo ./out/bosofad uninstall --scope system --data-dir /tmp/bosofa-service
      - name: Install as a service (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -dv ./out/bosofad 2>&1 | grep -q 'Signature=adhoc'
          sudo ./out/bosofad install --scope system --service-user "$USER" --data-dir /tmp/bosofa-service
          sleep 5
          sudo launchctl print system/com.bosofa.daemon | grep -q 'state = running'
          sudo ./out/bosofad uninstall --scope system --data-dir /tmp/bosofa-service
      - name: Install as a service (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./out/bosofad.exe install --scope system --data-dir 'C:\bosofa-service'
          sleep 5
          sc.exe query BoSoFaDaemon | grep -q RUNNING
          ./out/bosofad.exe uninstall --scope system --data-dir 'C:\bosofa-service'
      - name: Desktop archive
        shell: bash
        run: |
          mkdir app
          case "${{ matrix.rid }}" in
            win-*) unzip -q bundle/desktop/*-${{ matrix.rid }}.zip -d app ;;
            *) tar -xzf bundle/desktop/*-${{ matrix.rid }}.tar.gz -C app ;;
          esac
          find app -name release.json -exec cat {} \;
          find app -name release.json | grep -q .
      - name: Desktop signature (macOS)
        if: runner.os == 'macOS'
        run: codesign -dv app/*.app/Contents/MacOS/bosofa-desktop 2>&1 | grep -q 'Signature=adhoc'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm gen:api && git diff --exit-code -- packages/api/src/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build
