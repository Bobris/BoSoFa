name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The cluster tests run on a private Azurite blob service.
      - name: Install Azurite
        run: npm install --global azurite@3.35.0
      - run: dotnet build BoSoFa.slnx -c Release
      - name: Generated desktop RPC binding is up to date
        run: git diff --exit-code -- web/apps/desktop/neoastra/neoastra.ts
        shell: bash
      # Includes ContractTest: the checked-in web/packages/api/openapi.json must match the server.
      # A hung test fails after 3 minutes and is named in the log.
      - run: dotnet test BoSoFa.slnx -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none --logger "console;verbosity=normal"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Helm chart renders
        run: |
          helm lint deploy/helm/bosofa --strict \
            --set image.repository=r,secretName=s,azure.serviceUri=https://a.blob.core.windows.net,azure.clientId=c \
            --set ingress.enabled=true,ingress.host=h
      - name: Server image builds
        run: docker build -f deploy/Dockerfile -t bosofa-server:ci .

  daemon-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # Trimming and AOT warnings are errors (TreatWarningsAsErrors), so this is the AOT gate.
      - run: dotnet publish src/BoSoFa.Daemon -c Release -r ${{ matrix.rid }} -o out
      - run: ./out/bosofad version
        shell: bash
      # A real install: the service manager must accept the definition and keep the launcher running.
      - name: Install as a service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ./out/bosofad install --scope system --service-user "$USER" --data-dir /tmp/bosofa-service
          sleep 5
          systemctl is-active bosofad.service
          sudo ./out/bosofad uninstall --scope system --data-dir /tmp/bosofa-service
      - name: Install as a service (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo ./out/bosofad install --scope system --service-user "$USER" --data-dir /tmp/bosofa-service
          sleep 5
          sudo launchctl print system/com.bosofa.daemon | grep -q 'state = running'
          sudo ./out/bosofad uninstall --scope system --data-dir /tmp/bosofa-service
      - name: Install as a service (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./out/bosofad.exe install --scope system --data-dir 'C:\bosofa-service'
          sleep 5
          sc.exe query BoSoFaDaemon | grep -q RUNNING
          ./out/bosofad.exe uninstall --scope system --data-dir 'C:\bosofa-service'
      - uses: actions/upload-artifact@v4
        with:
          name: bosofad-${{ matrix.rid }}
          path: out/bosofad*
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm gen:api && git diff --exit-code -- packages/api/src/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build
