# Builds the daemon and the desktop app for every RID, signs their manifests and publishes them to one BoSoFa server,
# whose install page and updaters hand them out (docs/releasing.md).
#
# Repository variable BOSOFA_RELEASE_PUBLIC_KEY: the public key that `bosofad release-keygen` printed; every build embeds it.
# Repository variable BOSOFA_BRAND (optional): the brand to build, such as qsf (brands/<name>.props); bosofa when unset.
# Environment "release" (add a required reviewer): secrets BOSOFA_RELEASE_KEY (the private key's PEM text) and BOSOFA_TOKEN
# (an admin's API token with full control), variable BOSOFA_SERVER (the server's origin). Only the publish job sees them.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 1.2.0 or 1.3.0-beta.1
        required: true
      channel:
        description: Daemon channel; desktop apps take only stable releases
        type: choice
        options: [stable, beta]
        default: stable
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRAND: ${{ vars.BOSOFA_BRAND || 'bosofa' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          PUBLIC_KEY: ${{ vars.BOSOFA_RELEASE_PUBLIC_KEY }}
        run: |
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Set the repository variable BOSOFA_RELEASE_PUBLIC_KEY; builds without it refuse every update."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          else
            version="$INPUT_VERSION"
            channel="$INPUT_CHANNEL"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version such as 1.2.0 or 1.3.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  daemon:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: >-
          dotnet publish src/BoSoFa.Daemon -c Release -r ${{ matrix.rid }} -o out
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:BoSoFaReleasePublicKey=${{ vars.BOSOFA_RELEASE_PUBLIC_KEY }}
          -p:Brand=${{ env.BRAND }}
      # The daemon is the only executable in out/ besides debug symbols; its name comes from the brand.
      - name: Collect the daemon
        shell: bash
        run: |
          mkdir daemon
          for file in out/*; do
            case "$file" in *.pdb | *.dbg | *.dSYM | *.json) continue ;; esac
            [ -f "$file" ] && cp "$file" daemon/
          done
          ls daemon
          ./daemon/* version
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.rid }}
          path: daemon/*
          if-no-files-found: error

  desktop:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: >-
          dotnet publish src/BoSoFa.Desktop -c Release -r ${{ matrix.rid }} -p:BoSoFaPackage=true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:BoSoFaReleasePublicKey=${{ vars.BOSOFA_RELEASE_PUBLIC_KEY }}
          -p:Brand=${{ env.BRAND }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/package/*-desktop-*
          if-no-files-found: error

  publish:
    needs: [prepare, daemon, desktop]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Publish
        env:
          BOSOFA_RELEASE_KEY: ${{ secrets.BOSOFA_RELEASE_KEY }}
          BOSOFA_TOKEN: ${{ secrets.BOSOFA_TOKEN }}
          SERVER: ${{ vars.BOSOFA_SERVER }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [ -z "$BOSOFA_RELEASE_KEY" ] || [ -z "$BOSOFA_TOKEN" ] || [ -z "$SERVER" ]; then
            echo "::error::The release environment needs the secrets BOSOFA_RELEASE_KEY and BOSOFA_TOKEN and the variable BOSOFA_SERVER."
            exit 1
          fi
          # Each artifact holds one file, named after the brand.
          one() { set -- "$1"/*; if [ $# -ne 1 ] || [ ! -f "$1" ]; then echo "::error::Expected one file in ${1%/*}" >&2; return 1; fi; echo "$1"; }
          list() {
            out=""
            for rid in linux-x64 win-x64 osx-arm64; do file=$(one "dist/$1-$rid") || return 1; out="$out${out:+,}$rid=$file"; done
            echo "$out"
          }
          daemons=$(list daemon)
          desktops=$(list desktop)
          # The Linux build signs; it refuses a key other than the public key it embeds.
          signer=$(one dist/daemon-linux-x64)
          chmod +x "$signer"
          "$signer" release-publish --server "$SERVER" --product daemon --version "$VERSION" --channel "$CHANNEL" --artifacts "$daemons"
          "$signer" release-publish --server "$SERVER" --product desktop --version "$VERSION" --channel "$CHANNEL" --artifacts "$desktops"
