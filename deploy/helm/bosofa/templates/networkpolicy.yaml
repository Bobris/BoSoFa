{{- if .Values.networkPolicy.enabled }}
# The server trusts X-Forwarded-*, and the peer key crosses this port unencrypted, so only the ingress and other nodes get in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bosofa.name" . }}
  labels: {{- include "bosofa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "bosofa.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "bosofa.selector" . | nindent 14 }}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{- toYaml .Values.networkPolicy.ingressNamespaces | nindent 18 }}
      ports:
        - port: http
{{- end }}
