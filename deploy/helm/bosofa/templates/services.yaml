apiVersion: v1
kind: Service
metadata:
  name: {{ include "bosofa.name" . }}
  labels: {{- include "bosofa.labels" . | nindent 4 }}
spec:
  selector: {{- include "bosofa.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Stable DNS for each pod. Nodes must find each other before they are ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bosofa.peers" . }}
  labels: {{- include "bosofa.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "bosofa.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
